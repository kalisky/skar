[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skar"
version = "0.2.0"
description = "Skar runtime for Python — capture tool-using agent runs and emit Skar trace JSON for regression testing."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ofer Kalisky"}]
requires-python = ">=3.10"
keywords = [
    "ai-agents",
    "agent-testing",
    "regression-testing",
    "trace",
    "pytest",
    "anthropic",
    "claude",
    "langchain",
    "llm-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build",
]

[project.urls]
Homepage = "https://github.com/kalisky/skar"
Repository = "https://github.com/kalisky/skar"
Issues = "https://github.com/kalisky/skar/issues"

[tool.hatch.build.targets.wheel]
packages = ["skar"]

[tool.hatch.build.targets.sdist]
include = [
    "skar",
    "tests",
    "README.md",
    "pyproject.toml",
]
